<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the build owns the safe areas (design/pwa-checklist.md §2) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- title placeholder below is substituted from src/brand.ts at build time (vite.config.ts) -->
    <title>%BRAND%</title>
    <!-- %THEME_COLOR% is design/tokens.css's --color-bg, substituted at build time so the browser
         chrome, the manifest and the app's own paper ground can never disagree (tools/pwa.ts) -->
    <meta name="theme-color" content="%THEME_COLOR%" />
    <!-- Declared rather than left to the browser's /favicon.ico guess: the guess is a request
         nothing precaches, and offline that is a failure on every screen (tools/pwa.ts) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS has no install prompt: Share → "Add to Home Screen" is P1's install flow, and these
         lines are what it reads (design/pwa-checklist.md §3.3). `black-translucent` puts the
         status bar over the app, which is why the shell owns env(safe-area-inset-top). The
         standard `mobile-web-app-capable` sits beside the apple one because Chrome deprecated
         reading the latter — both, until iOS stops needing its own. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND%" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- iOS splash (#115): iOS ignores the manifest's background_color, so without a startup
         image per EXACT device size a cold standalone launch flashes white. One image per
         supported iPhone portrait viewport — the header lockup on --color-bg, generated by
         tools/make-splash.ts, which is also the one source of this list
         (tools/make-splash.test.ts cross-checks every line). Safari fetches only the matching
         image, at Add-to-Home-Screen time; the set is deliberately not precached (tools/pwa.ts). -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/icons/splash/splash-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/icons/splash/splash-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1242x2688.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1260x2736.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/splash/splash-1284x2778.png"

    <link
      rel="apple-touch-startup-image"

    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
